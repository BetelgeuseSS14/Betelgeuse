- type: job
  id: HeadOfPersonnel
  name: job-name-hop
  description: job-description-hop
  playTimeTracker: JobHeadOfPersonnel
  antagAdvantage: 6 # DeltaV - Reduced TC: Head of Staff
  requirements:
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 2.5h
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 2.5h
    - !type:DepartmentTimeRequirement
      department: Epistemics # DeltaV
      time: 2.5h
    - !type:DepartmentTimeRequirement
      department: Security
      time: 2.5h
    - !type:DepartmentTimeRequirement
      department: Command
      time: 2.5h
  weight: 10 # DeltaV - Changed HoP weight from 20 to 10 due to them not being more important than other Heads
  startingGear: HoPGear
  icon: "JobIconHeadOfPersonnel"
  requireAdminNotify: true # DeltaV
  supervisors: job-supervisors-captain
  canBeAntag: false
  access:
  - Command
  - HeadOfPersonnel
  - Bar
  - Service
  - Maintenance
  - Janitor
  - Theatre
  - Kitchen
  - Clerk
  - Chapel # DeltaV - Chapel is in Epistemics
  - Hydroponics
  - External
  - Cryogenics
  - Chemistry
  - Engineering
  - Research
  - Mantis
  - Robotics
  - Detective
  - Salvage
  - Mail
  - Security
  - Corpsman
  - Brig
  - Armory
  # Lawyer # we're removing law and replacing it with IA, don't make anyone a lawyer
  - Cargo
  - Orders
  - Atmospherics
  - Medical
  - Paramedic
  - Psychologist
  - Surgery
  # Begin DeltaV Additions - fine-grained service accesses
  - Boxer
  - Clown
  - Mime
  - Musician
  - Reporter
  - Zookeeper
  # End DeltaV Additions
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff
      - type: PsionicBonusChance # DeltaV: makes it more likely to become psionic.
        flatBonus: 0.025

- type: startingGear
  id: HoPGear
  equipment:
    #shoes: ClothingShoesLeather # DeltaV - Commented for Loadouts
    id: HoPPDA
    #gloves: ClothingHandsGlovesHop # DeltaV - Commented for Loadouts
    ears: ClothingHeadsetHoP # DeltaV - HoP is now a service role, replaces ClothingHeadsetAltCommand headset.
    belt: BoxFolderClipboardThreePapers
    eyes: ClothingEyesHudCommand
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: HeadOfPersonnelChameleonOutfit
  job: HeadOfPersonnel
  hasMindShield: true
  equipment:
    head: ClothingHeadHatHopcap
    eyes: ClothingEyesHudCommand
    mask: ClothingMaskNeckGaiterRed
    neck: ClothingNeckCloakHop
    outerClothing: ClothingOuterWinterHoP

